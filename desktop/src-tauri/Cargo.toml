[package]
name = "jupiter-desktop"
version = "1.0.13"
edition = "2021"
publish = false
autobins = false
default-run = "Jupiter"

[[bin]]
name = "Jupiter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image-webp = "0.2.4"
sha2 = "0.10"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
parking_lot = "0.12"
anyhow = "1"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux builders need libasound2-dev in addition to the existing Tauri packages.
[target.'cfg(all(any(target_os = "macos", target_os = "windows", target_os = "linux"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
cpal = "=0.16.0"
whisper-rs = { version = "=0.16.0", default-features = false }
whisper-rs-sys = { version = "=0.15.0", default-features = false }
rubato = "=0.16.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
fs2 = "=0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
hound = "=3.5.1"

[patch.crates-io]
cpal = { path = "vendor/cpal" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
